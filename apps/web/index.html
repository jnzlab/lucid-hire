<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#F5F5F1" />
		<meta
			name="description"
			content="LucidHire reads every CV against your job, marks what matches and what's missing, and hands you one ranked shortlist with the evidence behind every score."
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="canonical" href="https://lucidhire.io/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="LucidHire" />
		<meta property="og:url" content="https://lucidhire.io/" />
		<meta property="og:title" content="LucidHire: we read every CV, you meet the best ones" />
		<meta
			property="og:description"
			content="Post a job and share one link. LucidHire reads every application against your requirements and keeps one ranked shortlist with the evidence behind every score."
		/>
		<meta property="og:image" content="https://lucidhire.io/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="We read every CV. You meet the best ones. LucidHire." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="LucidHire: we read every CV, you meet the best ones" />
		<meta name="twitter:image" content="https://lucidhire.io/og-image.png" />
		<title>LucidHire: we read every CV, you meet the best ones</title>
		<!-- The dashboard's light or dark theme, applied before the first paint so it doesn't flash. Only /dashboard
		     pages follow it; everything else stays light. Mirrors src/lib/theme.ts (key lh-theme). -->
		<script>
			(function () {
				try {
					if (!/^\/dashboard(\/|$)/.test(location.pathname)) return;
					var choice = localStorage.getItem("lh-theme");
					var dark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					if (!dark) return;
					document.documentElement.classList.add("dark");
					document.documentElement.style.colorScheme = "dark";
					document.querySelector('meta[name="theme-color"]').setAttribute("content", "#141414");
				} catch (error) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
