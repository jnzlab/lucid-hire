<!doctype html>
<!-- Rebuild public/og-image.png: google-chrome --headless --no-sandbox --hide-scrollbars --window-size=1200,630 --screenshot=public/og-image.png file://$PWD/og/og-image.html -->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<style>
			@font-face {
				font-family: "Archivo Variable";
				src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2") format("woff2");
				font-weight: 100 900;
				font-stretch: 62% 125%;
			}
			@font-face {
				font-family: "Fragment Mono";
				src: url("../node_modules/@fontsource/fragment-mono/files/fragment-mono-latin-400-normal.woff2") format("woff2");
			}
			* { box-sizing: border-box; margin: 0; }
			html, body { width: 1200px; height: 630px; overflow: hidden; }
			body {
				background: #f5f5f1;
				color: #141414;
				font-family: "Archivo Variable", sans-serif;
				padding: 64px 72px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.logo { display: flex; align-items: center; gap: 16px; font-size: 44px; font-weight: 850; letter-spacing: -0.03em; font-stretch: 120%; line-height: 1; }
			.logo svg { width: 52px; height: 52px; }
			.mk { background: linear-gradient(101deg, transparent .06em, #ffe84a .15em, #ffe84a calc(100% - .16em), transparent calc(100% - .05em)) no-repeat 0 64% / 100% 68%; padding-inline: .1em; margin-inline: -.1em; border-radius: .16em .34em .2em .3em; }
			.logo .mk { background-size: 100% 62%; }
			h1 { font-size: 82px; white-space: nowrap; line-height: .98; font-weight: 820; letter-spacing: -0.04em; font-stretch: 112%; }
			h1 > span { display: block; }
			.label { font-family: "Fragment Mono", monospace; font-size: 24px; letter-spacing: .08em; text-transform: uppercase; color: #5c5c55; }
		</style>
	</head>
	<body>
		<div class="logo">
			<svg viewBox="0 0 26 26" aria-hidden="true">
				<rect width="26" height="26" rx="6" fill="#141414" />
				<path d="M6.5 7.5h9" stroke="#F5F5F1" stroke-width="2" stroke-linecap="round" />
				<path d="M5.5 13h15" stroke="#FFE84A" stroke-width="5.5" />
				<path d="M6.5 18.5h11" stroke="#F5F5F1" stroke-width="2" stroke-linecap="round" />
			</svg>
			<span>Lucid<span class="mk">Hire</span></span>
		</div>
		<h1>
			<span>We read <span class="mk">every CV.</span></span>
			<span>You meet the <span class="mk">best ones.</span></span>
		</h1>
		<p class="label">CV screening for small hiring teams · lucidhire.io</p>
	</body>
</html>
